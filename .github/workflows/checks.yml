name: Verify Touchline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - run: python scripts/check.py --suite full --json output/test-results.json
      - run: docker build -t touchline:check .
