<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>看台发布页 · 四版选一</title>
<style>
  :root { --bg: #0a0a0b; --text: #e8e6e3; --muted: #8a8780; --accent: #3dffc8; --line: #1f1f22; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif; }
  .bar { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; background: #0a0a0bf2; backdrop-filter: blur(8px); z-index: 9; }
  .bar h1 { font-size: 15px; margin: 0 16px 0 0; font-weight: 600; }
  .bar button { appearance: none; border: 1px solid var(--line); background: #121214; color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .bar .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  section { border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: baseline; gap: 14px; padding: 18px 24px; }
  .head b { color: var(--accent); font-size: 13px; }
  .head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .head p { margin: 0; color: var(--muted); font-size: 13px; }
  .head .open { margin-left: auto; color: var(--muted); font-size: 12px; text-decoration: none; border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; }
  .head .open:hover { color: var(--accent); }
  iframe { width: 100%; border: 0; display: block; background: #000; }
  body[data-w="desk"] iframe { height: 900px; }
  body[data-w="mobile"] iframe { height: 844px; width: 390px; margin: 0 auto; }
  body[data-w="mobile"] section { padding-bottom: 16px; }
</style>
</head>
<body data-w="desk">
<div class="bar">
  <h1>看台发布页 · 四版选一</h1>
  <button data-w="desk" aria-pressed="true">桌面</button>
  <button data-w="mobile" aria-pressed="false">手机</button>
  <span class="hint">各版框内可独立滚动 · 选好告诉我编号</span>
</div>
<section>
  <div class="head"><b>P1</b><h2>灯下</h2><p>一盏灯打在看台上，队徽与标题并置，四格「能做什么」，缩略图切换。</p><a class="open" href="p1/" target="_blank">单独打开 ↗</a></div>
  <iframe src="p1/" title="P1 灯下" loading="lazy"></iframe>
</section>
<section>
  <div class="head"><b>P2</b><h2>边线</h2><p>杂志版式：米白纸、双红线栏栅、刊头大字、报纸分栏、印厂样张。</p><a class="open" href="p2/" target="_blank">单独打开 ↗</a></div>
  <iframe src="p2/" title="P2 边线" loading="lazy"></iframe>
</section>
<section>
  <div class="head"><b>P3</b><h2>更衣室</h2><p>发布影片直接做满屏开场，先看片再读字；票根卡片与灯下展台。</p><a class="open" href="p3/" target="_blank">单独打开 ↗</a></div>
  <iframe src="p3/" title="P3 更衣室" loading="lazy"></iframe>
</section>
<section>
  <div class="head"><b>P4</b><h2>灯柱</h2><p>聚光灯锥与球场同心弧线，右侧灯柱导航，四段编号目录。</p><a class="open" href="p4/" target="_blank">单独打开 ↗</a></div>
  <iframe src="p4/" title="P4 灯柱" loading="lazy"></iframe>
</section>
<script>
  document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
    document.body.dataset.w = b.dataset.w;
    document.querySelectorAll(".bar button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
</script>
</body>
</html>
